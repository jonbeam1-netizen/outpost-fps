<!doctype html>
<html><head><meta charset="utf-8"><title>Ghillie rig</title>
<style>
  html,body{margin:0;height:100%;background:#20221e;color:#ddd;font:13px system-ui,sans-serif;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #ui{position:fixed;left:8px;top:8px;background:rgba(0,0,0,.55);padding:8px;border-radius:6px;max-width:560px}
  #ui button{margin:2px;background:#3a3d36;color:#eee;border:1px solid #666;border-radius:4px;padding:3px 8px;cursor:pointer}
  #ui button.on{background:#7a8a4a}
  #info{white-space:pre;font:11px monospace;margin-top:4px}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
  <div>stance <button data-st="0" class="on">stand</button><button data-st="1">crouch</button><button data-st="2">prone</button></div>
  <div><button id="walk">walk</button><button id="ads">ads</button><button id="scoped">scoped</button><button id="knifeSw">knife swing</button><button id="death">death</button><button id="reload">reload</button><button id="hb">hitboxes</button><button id="lean">lean</button></div>
  <div>gun <button data-g="awm" class="on">awm</button><button data-g="m82">m82</button><button data-g="svd">svd</button><button data-g="deagle">deagle</button><button data-g="knife">knife</button>
    pitch <input id="pitch" type="range" min="-1" max="1" step="0.05" value="0" style="width:90px"></div>
  <div>view <button data-v="row">row</button><button data-v="close">close-up</button><button data-v="side">side</button><button data-v="fp">fp arms</button><button data-v="far">far</button></div>
  <div id="info"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../js/util.js"></script>
<script src="../js/guns.js"></script>
<script src="../js/character.js"></script>
<script>
'use strict';
const errs = []; window.addEventListener('error', e => errs.push(e.message));
buildTextures();
try { gunMats(); } catch (e) { errs.push('gunMats: ' + e.message); }
// stand-in guns when guns.js is mid-rewrite or doesn't know the new ids yet
const SM = { b: new THREE.MeshStandardMaterial({ color: 0x2a2b2d, roughness: 0.5, metalness: 0.4 }), t: new THREE.MeshStandardMaterial({ color: 0x6a6a52, roughness: 0.7 }) };
function fakeGun(id) {
  const g = new THREE.Group(), M = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; g.add(o); return o; };
  const mk = (x, y, z) => { const o = new THREE.Object3D(); o.position.set(x, y, z); g.add(o); return o; };
  if (id === 'knife') {
    M(new THREE.BoxGeometry(0.03, 0.035, 0.12), SM.b, 0, 0, 0.01); M(new THREE.BoxGeometry(0.004, 0.03, 0.17), new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.3 }), 0, 0.005, -0.13);
    const grip = mk(0, 0, 0); return { group: g, grip, fore: grip, muzzle: mk(0, 0, -0.22), stockZ: 0.05, def: { melee: true } };
  }
  if (id === 'deagle') {
    M(new THREE.BoxGeometry(0.035, 0.04, 0.26), SM.b, 0, 0.03, -0.07); M(new THREE.BoxGeometry(0.032, 0.12, 0.05), SM.b, 0, -0.04, 0.03).rotation.x = -0.2;
    return { group: g, grip: mk(0, -0.04, 0.035), muzzle: mk(0, 0.03, -0.2), stockZ: 0.05, def: { pistol: true } };
  }
  const L = id === 'm82' ? 1.25 : 1.05;
  M(new THREE.BoxGeometry(0.06, 0.08, 0.5), SM.t, 0, 0, -0.05); M(new THREE.CylinderGeometry(0.012, 0.012, L * 0.6, 8).rotateX(Math.PI / 2), SM.b, 0, 0.02, -0.3 - L * 0.3);
  M(new THREE.BoxGeometry(0.05, 0.12, 0.3), SM.t, 0, -0.03, 0.3); M(new THREE.CylinderGeometry(0.022, 0.022, 0.32, 10).rotateX(Math.PI / 2), SM.b, 0, 0.09, -0.06);
  return { group: g, grip: mk(0, -0.06, 0.06), fore: mk(0, -0.03, -0.3), muzzle: mk(0, 0.02, -L), stockZ: 0.45, def: {}, magWell: new V3(0, -0.03, -0.05) };
}
const realGun = typeof buildGun === 'function' ? buildGun : null;
window.buildGun = (id, mods, sh) => { try { if (realGun && typeof WEAPONS !== 'undefined' && WEAPONS[id]) return realGun(id, mods, sh); } catch (e) { errs.push('buildGun ' + id + ': ' + e.message); } return fakeGun(id); };

const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05;
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; R.setPixelRatio(Math.min(2, devicePixelRatio));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9aa0a0); scene.fog = new THREE.Fog(0x9aa0a0, 30, 140);
scene.add(new THREE.HemisphereLight(0xcfd8e0, 0x5a5440, 0.62));
const sun = new THREE.DirectionalLight(0xffe6c0, 2.1); sun.position.set(-6, 12, 7); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 }); sun.shadow.bias = -0.0005; scene.add(sun);
const gt = TEX.ground; gt.repeat.set(20, 20);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ map: gt, color: 0x9a9a80, roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const cam = new THREE.PerspectiveCamera(45, 1, 0.02, 400);
const CAMERA = cam;   // character.js picks distance LODs against it
const keys = Object.keys(OUTFITS), ops = [];
const S = { stance: 0, walk: false, ads: false, scoped: false, melee: 0, swing: false, dead: false, reload: false, hb: false, gun: 'awm', pitch: 0, lean: 0 };
keys.forEach((k, i) => {
  const op = buildOperator(k, i); scene.add(op.root); setOperatorGun(op, S.gun, {});
  const x = (i - (keys.length - 1) / 2) * 1.3;
  ops.push({ op, k, base: new V3(x, 0, 0), st: { pos: new V3(x, 0, 0), yaw: 0, pitch: 0, alive: true } });
  const lab = document.createElement('canvas'); lab.width = 256; lab.height = 48; const g = lab.getContext('2d'); g.fillStyle = '#fff'; g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.fillText(OUTFITS[k].name, 128, 34);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(lab), depthTest: false })); sp.scale.set(0.9, 0.17, 1); sp.position.set(x, 2.15, 0); scene.add(sp); ops[i].label = sp;
});
// first-person arms test
const fpRoot = new THREE.Group(); scene.add(fpRoot); fpRoot.visible = false;
const fpM = charMats('woodland', 0), fpArms = [buildArm(fpRoot, fpM, 1, true), buildArm(fpRoot, fpM, -1, true)];
let fpGun = null;
// hitbox gizmos
const hbGroup = new THREE.Group(); scene.add(hbGroup);
const hbMat = { head: new THREE.MeshBasicMaterial({ color: 0xff3030, wireframe: true }), chest: new THREE.MeshBasicMaterial({ color: 0xffd030, wireframe: true }), legs: new THREE.MeshBasicMaterial({ color: 0x30a0ff, wireframe: true }) };
function drawHB() {
  hbGroup.clear(); if (!S.hb) return;
  ops.forEach(o => operatorHitboxes(o.st.pos, S.stance, S.lean, o.st.yaw).forEach(h => {
    if (h.type === 's') { const m = new THREE.Mesh(new THREE.SphereGeometry(h.r, 10, 6), hbMat[h.zone]); m.position.set(h.x, h.y, h.z); hbGroup.add(m); }
    else { const m = new THREE.Mesh(new THREE.CylinderGeometry(h.r, h.r, h.y1 - h.y0, 10, 1, true), hbMat[h.zone]); m.position.set(h.x, (h.y0 + h.y1) / 2, h.z); hbGroup.add(m); }
  }));
}
// ui
const tog = (id, f) => { const b = document.getElementById(id); b.onclick = () => { S[f] = !S[f]; b.classList.toggle('on', S[f]); }; };
['walk', 'ads', 'scoped', 'reload', 'hb'].forEach(k => tog(k, k));
document.getElementById('death').onclick = e => { S.dead = !S.dead; e.target.classList.toggle('on', S.dead); };
document.getElementById('lean').onclick = e => { S.lean = S.lean ? 0 : 1; e.target.classList.toggle('on', !!S.lean); };
document.getElementById('knifeSw').onclick = () => { S.melee = 0.001; };
document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { S.stance = +b.dataset.st; document.querySelectorAll('[data-st]').forEach(x => x.classList.toggle('on', x === b)); });
document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { S.gun = b.dataset.g; ops.forEach(o => setOperatorGun(o.op, S.gun, {})); document.querySelectorAll('[data-g]').forEach(x => x.classList.toggle('on', x === b)); buildFpGun(); });
document.getElementById('pitch').oninput = e => S.pitch = +e.target.value;
let view = 'row'; document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => setView(b.dataset.v));
// orbit
const orb = { yaw: Math.PI - 0.3, pitch: 0.15, dist: 9, tgt: new V3(0, 0.9, 0) };
function setView(v) {
  view = v; fpRoot.visible = v === 'fp'; ops.forEach(o => o.op.root.visible = v !== 'fp');
  if (v === 'row') Object.assign(orb, { yaw: Math.PI - 0.3, pitch: 0.15, dist: 9 }), orb.tgt.set(0, 0.9, 0);
  if (v === 'close') Object.assign(orb, { yaw: 0.5, pitch: 0.12, dist: 2.6 }), orb.tgt.set(ops[0].base.x + 0.65, 1.0, 0);
  if (v === 'side') Object.assign(orb, { yaw: 1.45, pitch: 0.15, dist: 3.4 }), orb.tgt.set(ops[3].base.x, 0.6, 0);
  if (v === 'far') Object.assign(orb, { yaw: 0.2, pitch: 0.05, dist: 45 }), orb.tgt.set(0, 0.8, 0);
}
let drag = null;
R.domElement.onpointerdown = e => drag = [e.clientX, e.clientY];
onpointerup = () => drag = null;
onpointermove = e => { if (!drag) return; orb.yaw -= (e.clientX - drag[0]) * 0.006; orb.pitch = clamp(orb.pitch + (e.clientY - drag[1]) * 0.004, -0.4, 1.4); drag = [e.clientX, e.clientY]; };
R.domElement.onwheel = e => { orb.dist = clamp(orb.dist * (1 + Math.sign(e.deltaY) * 0.1), 0.5, 80); };
function buildFpGun() { if (fpGun) fpRoot.remove(fpGun.group); fpGun = buildGun(S.gun, {}, false); fpRoot.add(fpGun.group); fpGun.group.position.set(0.14, -0.15, -0.5); }
buildFpGun();
function resize() { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now(), t = 0;
window.DEV = { S, ops, setView, R, scene, cam, orb, errs };
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  tick(dt); render();
  requestAnimationFrame(frame);
}
// advance n steps without rendering (for screenshots from a throttled background tab)
DEV.solo = (i, yaw, dist = 2.6, y = 1.0, pitch = 0.1) => { ops.forEach((o, j) => { o.op.root.visible = i < 0 || j === i; o.label.visible = i < 0; }); Object.assign(orb, { yaw, pitch, dist }); orb.tgt.set(i < 0 ? 0 : ops[i].base.x, y, 0); };
DEV.gun = id => { S.gun = id; ops.forEach(o => setOperatorGun(o.op, id, {})); buildFpGun(); };
DEV.step = (n = 40, dt = 0.05) => { for (let i = 0; i < n; i++) tick(dt); render(); };
function tick(dt) {
  t += dt;
  if (S.melee > 0) { S.melee += dt / 0.55; if (S.melee >= 1) S.melee = 0; }
  const spd = S.stance === 2 ? 0.7 : S.stance === 1 ? 1.8 : 3.2;
  ops.forEach((o, i) => {
    const st = o.st;
    st.pos.copy(o.base); if (S.walk) st.pos.z = o.base.z - ((t * spd) % 6) + 3;
    st.stance = S.stance; st.ads = S.ads; st.scoped = S.scoped; st.melee = S.melee; st.alive = !S.dead; st.reload = S.reload; st.pitch = S.pitch; st.lean = S.lean;
    animateOperator(o.op, st, dt);
  });
  if (view === 'fp') {
    cam.position.set(0, 1.6, 0); cam.rotation.set(DEV.fpPitch || 0, 0, 0); fpRoot.position.copy(cam.position); fpRoot.updateMatrixWorld(true);
    const g = fpGun; g.group.updateMatrixWorld(true); const q = new THREE.Quaternion().setFromRotationMatrix(g.group.matrixWorld);
    fpArms.forEach(arm => {
      const mk = arm.side > 0 ? g.grip : (g.fore || g.grip), wp = new V3(); mk.getWorldPosition(wp); fpRoot.worldToLocal(wp);
      arm.hand.position.copy(wp); arm.hand.quaternion.copy(q); if (arm.side < 0) arm.hand.rotateZ(Math.PI);
      const v = new V3(arm.side > 0 ? 0.015 : 0, -0.045 * arm.side, 0.07).applyQuaternion(arm.hand.quaternion).add(wp);
      solve2(arm.upper, arm.lower, new V3(arm.side * 0.24, -0.36, 0.08), v, new V3(arm.side * 1.2, -1, 0.3).normalize(), arm.la, arm.lb, true);
    });
  } else {
    const cp = Math.cos(orb.pitch); cam.position.set(orb.tgt.x + Math.sin(orb.yaw) * cp * orb.dist, orb.tgt.y + Math.sin(orb.pitch) * orb.dist, orb.tgt.z + Math.cos(orb.yaw) * cp * orb.dist); cam.lookAt(orb.tgt);
  }
}
function render() {
  drawHB();
  R.render(scene, cam);
  document.getElementById('info').textContent = `calls ${R.info.render.calls}  tris ${R.info.render.triangles}  lod ${ops.map(o => o.op.lodK).join('')}  ${errs.length ? 'ERR ' + errs.join(' | ') : ''}`;
}
requestAnimationFrame(frame);
</script>
</body></html>
